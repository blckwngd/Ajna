<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Ajna</title>
<style>
body { margin:0; overflow:hidden; width: 100%; height: 100%; }
#ui {
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(0,0,0,0.6);
  color:white;
  padding:10px;
  z-index:10;
}
canvas { width: 100%; height: 100%; }
input { display:block; margin:4px 0; }
</style>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/materialsLibrary/babylon.gridMaterial.min.js"></script>

<!-- Use import map to resolve module specifiers for 3D Tiles -->
<script type="importmap">
{
  "imports": {
    "@babylonjs/core": "https://cdn.jsdelivr.net/npm/@babylonjs/core@6.37.1/+esm",
    "@babylonjs/core/": "https://cdn.jsdelivr.net/npm/@babylonjs/core@6.37.1/",
    "@babylonjs/loaders": "https://cdn.jsdelivr.net/npm/@babylonjs/loaders@6.37.1?module",
    "@babylonjs/materials": "https://cdn.jsdelivr.net/npm/@babylonjs/materials@6.37.1?module",
    "@babylonjs/gui": "https://cdn.jsdelivr.net/npm/@babylonjs/gui@6.37.1?module",
    "@nasa/3d-tiles-renderer": "https://cdn.jsdelivr.net/npm/@nasa/3d-tiles-renderer@0.3.22/+esm",
    "@nasa/3d-tiles-renderer/": "https://cdn.jsdelivr.net/npm/@nasa/3d-tiles-renderer@0.3.22/"
  }
}
</script>
<body>

<div id="ui">
  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">
  <button id="loginBtn">Login</button>
  <button id="logoutBtn">Logout</button>
  <div id="status"></div>
</div>

<canvas id="renderCanvas"></canvas>

<script src="dist/bundle.js"></script>
</body>
</html>
