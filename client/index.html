<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajna</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
html, body { margin:0; height:100%; overscroll-behavior:none; }
body { display:flex; flex-direction:column; }
#map { flex:1; }
#editorSection {
  position:absolute; top:10px; right:10px; width:300px;
  background:rgba(0,0,0,0.6); color:white; padding:10px; z-index:1000;
  max-height:60vh; overflow:auto;
}
@media (max-width: 850px) {
  #editorSection { top:auto; right:0; bottom:0; left:0; width:auto; border-radius:0; }
}
</style>
</head>
<body>
<div id="map"></div>
<div id="editorSection"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
<script src="/dist/map.bundle.js"></script>
</body>
</html>
