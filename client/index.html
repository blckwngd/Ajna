<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ajna</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
:root {
  --tabbar-height: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #0f1115;
  --fg: #eaeaea;
  --fg-muted: #8a8f99;
  --accent: #2c5d8f;
  --accent-hi: #356da6;
  --card: #1a1d24;
  --border: #2a2f37;
}

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--fg);
  font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

/* ─── Shell-Layout ─────────────────────────────────────────────── */
.shell {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  /* Nicht unter die Geräte-Statusleiste zeichnen: Safe-Area oben als Abstand
     für ALLE Ansichten. --safe-top wird auf Android-Geräten, deren WebView
     env() nicht liefert, von mobile.js mit einem Fallback gesetzt. */
  padding-top: var(--safe-top, env(safe-area-inset-top, 0px));
  box-sizing: border-box;
}
.shell-views {
  flex: 1; position: relative; min-height: 0;
}
.shell-view {
  position: absolute; inset: 0; display: none;
}
.shell-view.active { display: block; }

/* Objektliste: Ist die Minimap oben angedockt, beginnt die Liste darunter.
   Die Höhe meldet die Minimap selbst (--mm-hoehe), damit hier keine zweite
   Kopie der Größenformel steht. Ohne angedockte Karte ist der Wert 0. */
.shell-view[data-view="nearby"] {
  padding-top: var(--mm-hoehe, 0px);
  /* Unten Platz für die Peil-Leiste, sonst liegt sie auf der letzten Zeile. */
  padding-bottom: 110px;
  box-sizing: border-box;
  transition: padding-top .15s ease;
}
/* Groß und unten: Sie werden im Gehen mit dem Daumen bedient, oft ohne
   hinzusehen. Kleine Knöpfe wären hier der falsche Sparsinn. */
.peil-leiste {
  position: absolute; left: 8px; right: 8px; bottom: 14px; z-index: 40;
  display: flex; gap: 8px;
}
.peil-leiste[hidden] { display: none; }
.peil-knopf {
  flex: 1 1 0; min-height: 62px; padding: 0 8px;
  border: 0; border-radius: 31px; cursor: pointer;
  font: 600 15px system-ui, sans-serif; color: #f2f5f8;
  background: linear-gradient(180deg, #2f6ea8, #24547e);
  box-shadow: 0 6px 20px rgba(0,0,0,.45);
  touch-action: none;                 /* Halten darf nicht scrollen */
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
/* Was gerade festgehalten wird, steht über der Leiste — auf den Knöpfen
   wäre dafür kein Platz, und ihre Beschriftung soll stehen bleiben. */
.peil-stand {
  position: absolute; left: 8px; right: 8px; bottom: 82px; z-index: 40;
  text-align: center; pointer-events: none;
  font: 500 13px system-ui, sans-serif; color: #dfe6ee;
  text-shadow: 0 1px 3px rgba(0,0,0,.8);
}
.peil-stand[hidden] { display: none; }
.peil-knopf.peilt {
  background: linear-gradient(180deg, #3f9ad6, #2f7bb0);
  box-shadow: 0 0 0 3px rgba(120,190,255,.35), 0 6px 20px rgba(0,0,0,.45);
}
.peil-knopf.gesperrt { background: linear-gradient(180deg, #2f8a5f, #226a49); }
.peil-knopf:disabled { opacity: .5; cursor: default; }

.shell-tabbar {
  display: flex;
  height: calc(var(--tabbar-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: #16191f;
  border-top: 1px solid var(--border);
}
.shell-tabbar button {
  flex: 1; background: transparent;
  color: var(--fg-muted);
  border: none; padding: 0; cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px;
  font: inherit; font-size: 11px;
  -webkit-tap-highlight-color: transparent;
}
.shell-tabbar button .tab-icon { font-size: 22px; line-height: 1; }
.shell-tabbar button.active { color: var(--fg); }
.shell-tabbar button.active .tab-icon { transform: scale(1.05); }
.shell-tabbar button:active { background: rgba(255,255,255,0.04); }

/* ─── Map-View ─────────────────────────────────────────────────── */
#map { width: 100%; height: 100%; background: #1a1d24; }

/* ─── AR-View (Babylon, lazy via mobile.js) ────────────────────── */
.shell-view[data-view="ar"] { background: #000; }
#renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
/* AR-Overlay (EditorUI im 'ar'-Modus) — kompakt über dem Canvas. */
.shell-view[data-view="ar"] #ui {
  position: absolute; top: 10px; left: 10px;
  max-width: 300px; max-height: 55%; overflow: auto;
  background: rgba(0,0,0,0.6); color: #fff; padding: 10px;
  border-radius: 8px; z-index: 10; font-size: 13px;
}
.ar-loading {
  position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center;
  color: var(--fg-muted); text-align: center; padding: 24px;
  pointer-events: none;  /* never block canvas touch, even if it lingers */
}
.ar-loading[hidden], .ar-hint[hidden] { display: none; }
.ar-hint {
  position: absolute; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 24px; gap: 6px;
  background: var(--bg); color: var(--fg);
}
.ar-hint .icon { font-size: 64px; opacity: 0.5; line-height: 1; margin-bottom: 8px; }
.ar-hint p { margin: 4px 0; max-width: 320px; }
.ar-hint .settings-btn { max-width: 320px; }

/* ─── Settings-View ────────────────────────────────────────────── */
.settings-view {
  height: 100%; overflow: auto;
  /* border-box: sonst ragt 100% + Padding über die View hinaus und übermalt
     die Tabbar. Unten zusätzlich Safe-Area, wie im Objekte-Tab. */
  box-sizing: border-box;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 12px;
  -webkit-overflow-scrolling: touch;
}
.settings-section {
  background: var(--card);
  border-radius: 8px;
  padding: 14px 16px;
}
.settings-section h3 {
  margin: 0 0 10px;
  font-size: 11px; color: #f1c40f;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.settings-row {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.settings-row:last-child { border-bottom: none; padding-bottom: 0; }
.settings-row .label { flex: 1; }
.settings-row .meta { color: var(--fg-muted); font-size: 12px; }
.settings-row > .meta { white-space: nowrap; }

.settings-input {
  display: block; width: 100%;
  background: #0f1115; color: var(--fg);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 12px; font: inherit; font-size: 15px;
  margin: 6px 0;
  box-sizing: border-box;
  -webkit-appearance: none;
  appearance: none;
}
.settings-input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

.settings-btn {
  display: block; width: 100%;
  background: var(--accent); color: #fff;
  border: none; border-radius: 6px;
  padding: 12px; font: inherit; font-size: 15px;
  cursor: pointer; margin-top: 6px;
  -webkit-tap-highlight-color: transparent;
}
.settings-btn:active { background: var(--accent-hi); }
.settings-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.settings-btn.secondary { background: #232831; }
.settings-btn.secondary:active { background: #2e3540; }

.settings-btn-inline {
  background: #232831; color: var(--fg);
  border: none; border-radius: 6px;
  padding: 6px 12px; font: inherit; font-size: 13px;
  cursor: pointer;
}
.settings-btn-inline:active { background: #2e3540; }

/* ─── EditorSection (Legacy) ───────────────────────────────────────
   map.js erwartet dieses Element zur Initialisierung von EditorUI.
   Auf der Mobile-Shell uebernimmt der Settings-Tab dessen Funktionen,
   die DOM-Instanz bleibt nur fuer die Konstruktor-Kompat im DOM. */
#editorSection { display: none !important; }
</style>
</head>
<body>

<div class="shell">
  <div class="shell-views">
    <section class="shell-view active" data-view="map">
      <div id="map"></div>
    </section>
    <section class="shell-view" data-view="ar">
      <!-- The AR (Babylon) bundle is lazy-loaded by mobile.js on first open and
           renders into this canvas; #ui hosts the AR overlay (EditorUI). -->
      <canvas id="renderCanvas"></canvas>
      <div id="ui"></div>
      <div class="ar-loading" data-role="ar-loading" hidden>AR wird geladen …</div>
      <!-- Shown when immersive WebXR is NOT supported in this WebView (Android):
           the user opens the AR page in Chrome, where WebXR + ARCore work. -->
      <div class="ar-hint" data-role="ar-hint" hidden>
        <div class="icon">🥽</div>
        <p>Immersives XR wird in dieser App nicht direkt unterstützt.</p>
        <p class="meta">Für volles AR/VR in Chrome öffnen — Login und Filter werden
          automatisch übernommen.</p>
        <button class="settings-btn" data-action="ar-open-chrome">In Chrome öffnen</button>
        <button class="settings-btn secondary" data-action="ar-preview">3D-Vorschau in der App</button>
      </div>
    </section>
    <section class="shell-view" data-view="nearby">
      <!-- Nächstgelegene Objekte (NearbyList.js, von MobileShell verdrahtet). -->
      <div class="nearby-root"></div>
      <!-- Peilen: gedrückt halten sortiert nach Blickrichtung, Loslassen hält
           das oberste Objekt fest, kurzes Antippen hebt es wieder auf.
           Drei Entfernungen, weil ein Flugzeug sonst hinter jeder Laterne
           verschwindet, die zufällig auf derselben Linie steht. -->
      <div id="peilLeiste" class="peil-leiste" hidden>
        <button type="button" class="peil-knopf" data-band="nah"></button>
        <button type="button" class="peil-knopf" data-band="mittel"></button>
        <button type="button" class="peil-knopf" data-band="fern"></button>
      </div>
      <div id="peilStand" class="peil-stand" hidden></div>
    </section>
    <section class="shell-view" data-view="settings">
      <div id="mobileSettings" class="settings-view"></div>
    </section>
  </div>
  <nav class="shell-tabbar" role="tablist">
    <button data-tab="map" class="active" role="tab" aria-label="Karte">
      <span class="tab-icon">🗺️</span><span>Karte</span>
    </button>
    <button data-tab="ar" role="tab" aria-label="AR">
      <span class="tab-icon">🥽</span><span>AR</span>
    </button>
    <button data-tab="nearby" role="tab" aria-label="Objekte">
      <span class="tab-icon">📋</span><span>Objekte</span>
    </button>
    <button data-tab="settings" role="tab" aria-label="Einstellungen">
      <span class="tab-icon">⚙️</span><span>Einstellungen</span>
    </button>
  </nav>
</div>

<!-- Legacy: von map.js' EditorUI als Container gefordert. Auf Mobile unsichtbar. -->
<div id="editorSection"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="/dist/map.bundle.js"></script>
<script src="/dist/mobile.bundle.js"></script>
</body>
</html>
