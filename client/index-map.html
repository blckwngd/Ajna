<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Ajna 2D Map Client</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<style>
body{margin:0;height:100vh;display:flex;}
#map{flex:1;}
#editorSection { position:absolute; top:10px; right:10px; width:300px;background:rgba(0,0,0,0.6); color:white; padding:10px; z-index:1000; }
@media (max-width: 850px) {
  body{flex-direction:column;}
  #map{height:60vh;}
  #sidebar{width:100%;height:40vh;border-left:none;border-top:1px solid #ccc;}
  #editorSection{display:none;}
  #editorSection.visible{display:block;}
  #editorToggle{display:block;}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="editorSection"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
<script src="/dist/map.bundle.js"></script>
</body>
</html>
